name: Validate standalone Roblox source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-rojo-build:
    name: Unit tests and pinned Rojo build (no publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run configuration safety unit tests
        run: python -m unittest discover -s tests -v

      - name: Install pinned official Rojo 7.7.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rojo"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/rojo.zip"
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          ROJO_BIN="$(find "$RUNNER_TEMP/rojo" -type f -name rojo -print -quit)"
          test -n "$ROJO_BIN"
          chmod +x "$ROJO_BIN"
          echo "ROJO_BIN=$ROJO_BIN" >> "$GITHUB_ENV"

      - name: Check environment and guard
        run: python scripts/dev.py doctor

      - name: Build XML place snapshot (never publish)
        run: python scripts/dev.py build

      - name: Verify artifact exists
        run: test -s build/SignalLost.rbxlx

      - name: Upload build artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: SignalLost-rojo-build
          path: build/SignalLost.rbxlx
          if-no-files-found: error
          retention-days: 7
